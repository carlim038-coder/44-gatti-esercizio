<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gestore File di Gatti</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h1>Gestore Gatti</h1>
        <p>Inserisci il totale dei gatti e quanti ne vuoi per fila:</p>
        
        <input type="number" id="totaleGatti" placeholder="Totale Gatti">
        <input type="number" id="gattiPerFila" placeholder="Gatti per Fila">
        
        <button id="btnCalcola">Calcola File</button>
        
        <div id="displayRisultato"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
